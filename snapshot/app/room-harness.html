<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>OFFLINE room playback integration</title><script defer src="/output-renderer.js"></script><script type="module" src="/room-harness.mjs"></script><style>body{background:#122219;color:#e7f3e9;font:16px system-ui;margin:20px}button,input,textarea{font:inherit;margin:5px;padding:12px;background:#e7f3e9;color:#14291d}#host{position:relative;width:min(100%,960px);aspect-ratio:16/9;background:#000;overflow:hidden}#local{width:min(100%,960px);aspect-ratio:16/9}#status,#credit{white-space:pre-wrap}a{color:#a7e0ba}textarea{width:min(80%,700px)}.hidden{display:none}</style><h1>保存素材での参加・再生検証</h1><p>OFFLINE・生成API0。新しいpromptを反映した生成物ではありません。音声はownerの1系統。</p><div id="owner"><button id="new-room">room作成</button><button id="start" disabled>再生開始</button><button id="stop" disabled>演奏停止</button><button id="output">映像出力</button><a id="join-link"></a><p id="audition-note" hidden>本人用の有限試聴です。拍・phrase・keyの自動判定は保留、投稿者クレジットは付きません。</p><select id="audition-plan" hidden aria-label="音声QC済みの接続案"></select><button id="audition" hidden disabled>選んだ接続案を有限試聴</button><div id="host"></div><canvas id="local" width="1280" height="720"></canvas><strong id="credit">投稿者表示は再生ack待ち</strong></div><div id="participant" hidden><p>匿名参加・OFFLINE既存素材検証</p><input id="nickname" maxlength="40" placeholder="nickname"><button id="join">参加</button><textarea id="prompt" maxlength="2000" placeholder="会場をどう変えたいか"></textarea><button id="submit" disabled>投稿</button></div><pre id="status" role="status">未開始</pre></html>
