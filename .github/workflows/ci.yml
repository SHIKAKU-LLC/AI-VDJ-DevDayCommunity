name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - name: Repository content policy
        run: python scripts/check_repository.py
      - name: Reproduce CPU environment and run synthetic checks
        run: bash scripts/setup_environment.sh

  web-and-room:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            qa-tools/package-lock.json
            snapshot/package-lock.json
      - name: Install pinned local PostgreSQL verification runtime
        run: npm ci --prefix qa-tools --ignore-scripts --no-audit --no-fund
      - name: Install pinned portable SDK dependencies for synthetic header checks
        run: npm ci --prefix snapshot --ignore-scripts --no-audit --no-fund
      - name: Verify portable runtime, public UI, and durable collect contract
        run: node --test --test-concurrency=2 tests/*.test.mjs snapshot/app/runtime/*.test.mjs integration/mac-host/*.test.mjs

  runtime-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: qa-tools/runtime-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: qa-tools/package-lock.json
      - name: Install pinned offline analysis dependencies
        run: python -m pip install -r qa-tools/runtime-requirements.txt
      - name: Install pinned PostgreSQL runtime for native cloud integration checks
        run: npm ci --prefix qa-tools --ignore-scripts --no-audit --no-fund
      - name: Install FFmpeg for synthetic DSP checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Check synthetic DSP
        run: python snapshot/app/runtime/dj-transition-dsp.test.py
      - name: Check synthetic musical features
        run: python snapshot/app/runtime/musical-features.test.py
      - name: Check independent evidence
        run: python snapshot/app/independent-evidence.test.py
      - name: Check native integration in two isolated processes
        run: |
          VDJ_QC_PYTHON=python VDJ_QC_DSP=snapshot/app/runtime/dj-transition-dsp.py \
            node --test --test-concurrency=2 \
            tests/portable-qc-native.test.mjs \
            tests/prototype-native-pipeline.test.mjs \
            tests/cloud-worker-native.test.mjs \
            tests/cloud-visual-plan-native.test.mjs \
            tests/operator-bootstrap-video.test.mjs \
            tests/cloud-production-host-native.test.mjs \
            tests/cloud-first-e2e.test.mjs \
            tests/cloud-native-continuation.test.mjs \
            tests/cloud-owner-autodj-integration.test.mjs \
            tests/mac-edge-launch-flow.test.mjs
